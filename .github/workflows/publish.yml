name: Publish
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest
      - uses: actions/setup-node@v4
        with:
          # Node 24 ships npm 11.x — required for OIDC trusted publishing
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - run: bun install
      - run: bun run build
      - run: bunx changeset version || echo "no pending changesets"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Trusted publishing: authenticated via OIDC claims — no NPM_TOKEN needed
      - run: bunx changeset publish
        env:
          NPM_CONFIG_PROVENANCE: true
